<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10152b"><title>Spark — Science Discovery</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f5f7ff;background:#0c1022}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#29355e,#0c1022 60%);min-height:100vh}.app{max-width:520px;margin:auto;padding:20px 18px 110px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.logo{font-weight:850;font-size:23px;letter-spacing:-.8px}.logo span{color:#9ba7ff}.muted{color:#aeb9d6;font-size:13px}.pill{border:1px solid #3d476b;background:#202a48;border-radius:999px;padding:8px 12px;font-weight:700}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:18px 0}.stat,.card,.hero,.panel{background:#19213b;border:1px solid #344061;border-radius:20px}.stat{text-align:center;padding:13px 5px}.stat strong{display:block;font-size:21px}.stat small{color:#b9c4e3}.hero{padding:22px;background:linear-gradient(135deg,#323c83,#19213b);margin-bottom:22px}.hero h1{font-size:27px;line-height:1.15;margin:7px 0}.hero p{color:#d1daf6;line-height:1.5}.button{border:0;background:#a6b0ff;color:#101631;font-weight:800;padding:13px 16px;border-radius:13px;cursor:pointer;font-size:15px}.button.secondary{background:#303d62;color:#eef1ff}.button:disabled{opacity:.4}.section-title{font-size:19px;font-weight:800;margin:20px 0 12px}.subject-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{padding:16px;cursor:pointer;text-align:left;color:inherit;font:inherit}.card .emoji{font-size:34px}.card h3{margin:10px 0 4px;font-size:16px}.card p{color:#b8c3de;font-size:12px;line-height:1.5;margin:0}.card.wide{grid-column:1/-1}.progress{height:7px;background:#303b5b;border-radius:20px;overflow:hidden;margin-top:13px}.progress i{display:block;background:#9eaaff;height:100%;border-radius:20px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#11182df5;border-top:1px solid #33405e;display:flex;justify-content:center;padding:9px 4px max(10px,env(safe-area-inset-bottom));z-index:4}.nav{width:min(520px,100%);display:flex;justify-content:space-around}.nav button{background:none;color:#aeb9d6;border:0;padding:6px 10px;font-size:11px;cursor:pointer}.nav button.active{color:#b3bbff}.nav b{display:block;font-size:21px;margin-bottom:3px}.back{background:none;border:0;color:#bfc9ee;padding:0 0 16px;font-size:15px;cursor:pointer}.lesson{padding:19px;margin:12px 0}.lesson h2{margin:6px 0}.lesson p{line-height:1.65;color:#d7def4}.eyebrow{text-transform:uppercase;color:#b6c0ff;font-size:11px;font-weight:800;letter-spacing:1.3px}.answer{width:100%;text-align:left;background:#263152;border:1px solid #455275;border-radius:12px;padding:14px;color:white;margin:7px 0;cursor:pointer;font-size:15px}.answer.correct{border-color:#68dfb3;background:#194c48}.answer.wrong{border-color:#ff8291;background:#5b2b44}.feedback{padding:13px;border-radius:12px;background:#273351;margin-top:10px;line-height:1.5}.panel{padding:18px;margin:12px 0}input[type=range]{width:100%;accent-color:#b0baff}.control{margin:16px 0}.control label{display:flex;justify-content:space-between;margin-bottom:7px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:9px}.metric{background:#252f4f;border-radius:12px;padding:12px}.metric strong{font-size:21px;display:block;margin-top:4px}svg{max-width:100%;height:auto}.small{font-size:12px;color:#bbc5e1}.tag{display:inline-block;padding:5px 9px;border-radius:99px;background:#313c63;color:#cdd5ff;font-size:12px;margin:3px}.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#a6b0ff;color:#121831;padding:12px 18px;border-radius:14px;font-weight:800;z-index:10;box-shadow:0 6px 35px #0008}.empty{color:#c3cce7;line-height:1.6}
</style></head><body><main class="app" id="app"></main><div class="bottom"><div class="nav" id="nav"></div></div><script>
const KEY='curiosity-lab-v1';let saved={xp:0,streak:0,lastDay:'',completed:[],quizWins:0};try{saved={...saved,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{}let state={page:'home',subject:'astronomy',lesson:0,question:0,selected:null,answered:false,angle:45,speed:20,gravity:9.81,planetMass:5,starDistance:10,wingSpeed:30,wingArea:12,wingCL:0.9,...saved};const topics={astronomy:{name:'Astronomy',emoji:'🪐',subtitle:'Explore the cosmos',lessons:[{title:'Why do planets orbit?',text:'Planets move forward through space while gravity pulls them toward a star. Together, these create curved paths called orbits. Without gravity, a planet would travel in a straight line. Without sideways motion, it would fall toward the star.',fact:'An orbit is a continuous fall around another object.',q:'What keeps a planet in orbit?',choices:['Gravity and sideways motion','Only sunlight','The planet’s atmosphere'],correct:0,why:'Gravity bends the planet’s forward motion into an orbit.'},{title:'What is a light-year?',text:'A light-year is a measure of distance, not time. It is how far light travels in one year: about 9.46 trillion kilometers. Looking at distant stars is like looking into the past because their light takes time to reach us.',fact:'Sunlight takes about 8 minutes to reach Earth.',q:'A light-year measures what?',choices:['Time','Distance','Brightness'],correct:1,why:'It describes how far light travels in one year.'},{title:'Black holes and gravity',text:'A black hole is a region where gravity is so strong that light cannot escape from inside its event horizon. Black holes can form when very massive stars collapse. Their gravity affects nearby objects, but they do not magically suck up everything in the universe.',fact:'The event horizon marks the boundary beyond which light cannot escape.',q:'What is the event horizon?',choices:['The surface of a star','The escape boundary of a black hole','A planet’s orbit'],correct:1,why:'Beyond the event horizon, no light can escape to a distant observer.'}]},physics:{name:'Physics',emoji:'⚛️',subtitle:'Discover the rules of motion',lessons:[{title:'Forces change motion',text:'Newton’s second law is F = ma. Force equals mass times acceleration. The same push causes more acceleration for a lighter object than for a heavier one. If forces are balanced, an object’s velocity does not change.',fact:'Acceleration is a change in velocity, not just an increase in speed.',q:'If the same force acts on twice the mass, acceleration is…',choices:['Twice as large','Half as large','Unchanged'],correct:1,why:'Since a = F/m, doubling mass halves acceleration.'},{title:'Energy never disappears',text:'Energy can move between objects and change forms. A ball held high has gravitational potential energy. As it falls, potential energy becomes kinetic energy. With air resistance, some energy becomes thermal energy.',fact:'Kinetic energy is ½mv², so doubling speed quadruples kinetic energy.',q:'Doubling speed changes kinetic energy by…',choices:['2×','4×','8×'],correct:1,why:'Speed is squared in KE = ½mv².'},{title:'Why launch angle matters',text:'Projectile motion combines constant horizontal velocity with vertical acceleration due to gravity, if we ignore air resistance. On level ground, a 45° launch gives the greatest range for a fixed launch speed.',fact:'Complementary angles, such as 30° and 60°, have the same ideal range.',q:'Ignoring drag, what launch angle maximizes range on level ground?',choices:['15°','45°','80°'],correct:1,why:'Range = v² sin(2θ)/g, maximized when θ = 45°.'}]},aerodynamics:{name:'Aerodynamics',emoji:'✈️',subtitle:'Understand flight and airflow',lessons:[{title:'The four forces of flight',text:'An aircraft experiences lift, weight, thrust, and drag. Lift acts perpendicular to the relative airflow; drag opposes the motion through air. Thrust propels the plane, while weight is caused by gravity.',fact:'A plane can fly at constant speed and altitude when forces balance.',q:'Which force opposes movement through air?',choices:['Lift','Drag','Thrust'],correct:1,why:'Drag acts opposite to the aircraft’s motion relative to the air.'},{title:'Dynamic pressure',text:'Dynamic pressure describes how strongly moving air contributes to aerodynamic forces. The formula is q = ½ρv², where ρ is air density and v is airspeed. Because speed is squared, doubling speed makes dynamic pressure four times larger at the same density.',fact:'Air density and speed both matter for aerodynamic forces.',q:'Doubling airspeed multiplies dynamic pressure by…',choices:['2','4','8'],correct:1,why:'Dynamic pressure is proportional to speed squared.'},{title:'How wings make lift',text:'Wings generate lift by changing the airflow around them. Pressure differences and downward deflection of air are two complementary ways to describe the physics. A useful lift equation is L = ½ρv²SCₗ, where S is wing area and Cₗ is the lift coefficient.',fact:'Angle of attack affects the lift coefficient, but excessive angle can cause a stall.',q:'If wing area doubles and everything else stays fixed, lift becomes…',choices:['Half','Double','Four times'],correct:1,why:'Lift is directly proportional to wing area in the lift equation.'}]}};
const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const day=()=>new Date().toLocaleDateString('en-CA');function persist(){['xp','streak','lastDay','completed','quizWins'].forEach(k=>saved[k]=state[k]);localStorage.setItem(KEY,JSON.stringify(saved))}function award(id,amount){if(state.completed.includes(id))return false;state.completed.push(id);state.xp+=amount;let today=day();if(state.lastDay!==today){let yesterday=new Date();yesterday.setDate(yesterday.getDate()-1);state.streak=state.lastDay===yesterday.toLocaleDateString('en-CA')?state.streak+1:1;state.lastDay=today}persist();toast('+'+amount+' XP earned!');return true}function toast(t){let x=document.createElement('div');x.className='toast';x.textContent=t;document.body.append(x);setTimeout(()=>x.remove(),1800)}function navigate(p,s){state.page=p;if(s)state.subject=s;state.selected=null;state.answered=false;render();scrollTo(0,0)}function top(){return `<header><div class="logo">⚡ Spark</div><div class="pill">⚡ ${state.xp} XP</div></header>`}function home(){let total=Object.values(topics).reduce((a,t)=>a+t.lessons.length,0);return `${top()}<section class="hero"><div class="eyebrow">YOUR SCIENCE ADVENTURE</div><h1>Big questions.<br>Mind-blowing answers.</h1><p>Explore the universe, master physics, and discover how airplanes fly. Learn, experiment, and level up.</p><button class="button" onclick="navigate('subject','${nextTopic()}')">Continue learning →</button></section><div class="stats"><div class="stat"><strong>⚡ ${state.xp}</strong><small>Total XP</small></div><div class="stat"><strong>🔥 ${displayStreak()}</strong><small>Day streak</small></div><div class="stat"><strong>🎓 ${state.completed.filter(x=>x.startsWith('lesson:')).length}/${total}</strong><small>Lessons</small></div></div><div class="section-title">Explore subjects</div><div class="subject-grid">${Object.entries(topics).map(([id,t])=>`<button class="card" onclick="navigate('subject','${id}')"><div class="emoji">${t.emoji}</div><h3>${t.name}</h3><p>${t.subtitle}</p><div class="progress"><i style="width:${100*t.lessons.filter((_,i)=>state.completed.includes('lesson:'+id+':'+i)).length/t.lessons.length}%"></i></div></button>`).join('')}</div><div class="section-title">Your next experiment</div><button class="card wide" style="width:100%" onclick="navigate('lab')"><div class="emoji">🚀</div><h3>Interactive science sandbox</h3><p>Launch projectiles, explore orbital gravity, and test aircraft lift.</p></button>`}function nextTopic(){return Object.keys(topics).find(id=>topics[id].lessons.some((_,i)=>!state.completed.includes('lesson:'+id+':'+i)))||'astronomy'}function displayStreak(){if(!state.lastDay)return 0;let y=new Date();y.setDate(y.getDate()-1);return state.lastDay===day()||state.lastDay===y.toLocaleDateString('en-CA')?state.streak:0}function subject(){let t=topics[state.subject];return `${top()}<button class="back" onclick="navigate('home')">← All subjects</button><div class="hero"><div style="font-size:44px">${t.emoji}</div><h1>${t.name}</h1><p>${t.subtitle}. Lessons adapt from foundational concepts toward more challenging ideas.</p></div><div class="section-title">Learning path</div>${t.lessons.map((l,i)=>{let done=state.completed.includes('lesson:'+state.subject+':'+i);return `<button class="card wide" style="width:100%;margin-bottom:11px;display:flex;align-items:center;gap:14px" onclick="openLesson(${i})"><div style="font-size:25px">${done?'✅':i===0?'🌟':'📘'}</div><div style="flex:1"><div class="eyebrow">LESSON ${i+1} · ${i===0?'FOUNDATIONS':i===1?'EXPLORER':'CHALLENGE'}</div><h3>${esc(l.title)}</h3><p>${done?'Completed · Review anytime':'Read + quiz · 30 XP'}</p></div><div>›</div></button>`}).join('')}<button class="button secondary" onclick="navigate('lab')">🧪 Try the science lab</button>`}function openLesson(i){state.lesson=i;state.page='lesson';state.answered=false;state.selected=null;render();scrollTo(0,0)}function lesson(){let l=topics[state.subject].lessons[state.lesson],id='lesson:'+state.subject+':'+state.lesson,done=state.completed.includes(id);return `${top()}<button class="back" onclick="navigate('subject')">← ${topics[state.subject].name}</button><div class="eyebrow">LESSON ${state.lesson+1} OF 3</div><section class="panel lesson"><h2>${esc(l.title)}</h2><p>${esc(l.text)}</p><div class="feedback">💡 <b>Cool fact:</b> ${esc(l.fact)}</div></section><div class="section-title">Check your understanding</div><div class="panel"><h3>${esc(l.q)}</h3>${l.choices.map((c,i)=>`<button class="answer ${state.answered?(i===l.correct?'correct':i===state.selected?'wrong':''):''}" onclick="answer(${i})" ${state.answered?'disabled':''}>${String.fromCharCode(65+i)}. ${esc(c)}</button>`).join('')}${state.answered?`<div class="feedback">${state.selected===l.correct?'🎉 Correct!':'🔍 Not quite.'} ${esc(l.why)}</div><button class="button" style="margin-top:13px" onclick="${state.selected===l.correct?'finishLesson()':'retry()'}">${state.selected===l.correct?(done?'Back to lessons':'Complete lesson →'):'Try again →'}</button>`:''}</div>`}function answer(i){if(state.answered)return;state.selected=i;state.answered=true;render()}function retry(){state.answered=false;state.selected=null;render()}function finishLesson(){let id='lesson:'+state.subject+':'+state.lesson;if(award(id,30))state.quizWins++;persist();navigate('subject')}
function lab(){return `${top()}<div class="section-title">🧪 Science Sandbox</div><p class="muted">Change the variables. Watch what happens. Learn by experimenting.</p><div class="panel"><div class="eyebrow">PHYSICS EXPERIMENT</div><h2>🚀 Projectile launcher</h2><p class="small">Ideal motion on level ground, without air resistance.</p><div id="trajectory"></div><div class="control"><label>Launch angle <b id="angleV">${state.angle}°</b></label><input aria-label="Launch angle" type="range" min="5" max="85" value="${state.angle}" oninput="state.angle=+this.value;updateLab()"></div><div class="control"><label>Launch speed <b id="speedV">${state.speed} m/s</b></label><input aria-label="Launch speed" type="range" min="5" max="40" value="${state.speed}" oninput="state.speed=+this.value;updateLab()"></div><div class="metrics"><div class="metric"><small>Range</small><strong id="rangeV"></strong></div><div class="metric"><small>Max height</small><strong id="heightV"></strong></div></div><p class="small">Challenge: Which angle gives the longest range? Try 45°.</p><button class="button secondary" onclick="state.angle=45;state.speed=20;render()">Reset launcher</button></div><div class="panel"><div class="eyebrow">ASTRONOMY EXPERIMENT</div><h2>🪐 Gravity explorer</h2><p class="small">Compare gravitational acceleration at a fixed distance from an object as its mass changes. Simplified model: g = GM/r².</p><div class="control"><label>Mass of object <b id="massV">${state.planetMass} Earth masses</b></label><input aria-label="Object mass" type="range" min="1" max="20" value="${state.planetMass}" oninput="state.planetMass=+this.value;updateLab()"></div><div class="metric">Relative gravitational pull at the same distance<strong id="gravityV"></strong></div><p class="small">Doubling mass doubles gravitational pull when distance is unchanged.</p></div><div class="panel"><div class="eyebrow">AERODYNAMICS EXPERIMENT</div><h2>✈️ Wing lift simulator</h2><p class="small">L = ½ρv²SCₗ, using sea-level air density 1.225 kg/m³ and a fixed lift coefficient of 0.9.</p><div class="control"><label>Airspeed <b id="wingSpeedV">${state.wingSpeed} m/s</b></label><input aria-label="Airspeed" type="range" min="5" max="90" value="${state.wingSpeed}" oninput="state.wingSpeed=+this.value;updateLab()"></div><div class="control"><label>Wing area <b id="wingAreaV">${state.wingArea} m²</b></label><input aria-label="Wing area" type="range" min="2" max="35" value="${state.wingArea}" oninput="state.wingArea=+this.value;updateLab()"></div><div class="metric">Estimated lift<strong id="liftV"></strong></div><p class="small">Try doubling speed. Does lift double or quadruple?</p></div>`}function updateLab(){if(state.page!=='lab')return;let a=state.angle*Math.PI/180,v=state.speed,g=9.81,range=v*v*Math.sin(2*a)/g,h=v*v*Math.sin(a)**2/(2*g);let points=Array.from({length:61},(_,i)=>{let t=i/60*2*v*Math.sin(a)/g,x=v*Math.cos(a)*t,y=v*Math.sin(a)*t-.5*g*t*t;return `${18+300*x/Math.max(range,.01)},${165-130*y/Math.max(h,.01)}`}).join(' ');document.getElementById('trajectory').innerHTML=`<svg viewBox="0 0 336 184" role="img" aria-label="Projectile trajectory"><line x1="15" y1="165" x2="322" y2="165" stroke="#7481a6"/><polyline points="${points}" fill="none" stroke="#9eaaff" stroke-width="3"/><circle cx="18" cy="165" r="5" fill="#fff"/><text x="20" y="180" fill="#aeb9d6" font-size="10">Launch</text></svg>`;let vals={angleV:state.angle+'°',speedV:state.speed+' m/s',rangeV:range.toFixed(1)+' m',heightV:h.toFixed(1)+' m',massV:state.planetMass+' Earth masses',gravityV:state.planetMass+'× Earth-mass reference',wingSpeedV:state.wingSpeed+' m/s',wingAreaV:state.wingArea+' m²',liftV:Math.round(.5*1.225*state.wingSpeed**2*state.wingArea*.9).toLocaleString()+' N'};Object.entries(vals).forEach(([id,val])=>document.getElementById(id).textContent=val)}function progressPage(){let completed=state.completed.filter(x=>x.startsWith('lesson:'));let rank=state.xp<90?'Curious Beginner':state.xp<180?'Science Explorer':state.xp<270?'Science Investigator':'Cosmic Thinker';return `${top()}<div class="section-title">🏆 Your Progress</div><div class="hero"><div class="eyebrow">CURRENT RANK</div><h1>${rank}</h1><p>Every completed lesson gives 30 XP. Build a streak by completing at least one new lesson each day.</p></div><div class="stats"><div class="stat"><strong>${state.xp}</strong><small>XP</small></div><div class="stat"><strong>${displayStreak()} 🔥</strong><small>Streak</small></div><div class="stat"><strong>${completed.length}</strong><small>Lessons</small></div></div><div class="section-title">Subject mastery</div>${Object.entries(topics).map(([id,t])=>{let count=t.lessons.filter((_,i)=>completed.includes('lesson:'+id+':'+i)).length;return `<button class="card wide" style="width:100%;margin-bottom:12px" onclick="navigate('subject','${id}')"><h3>${t.emoji} ${t.name} <span style="float:right">${count}/3</span></h3><div class="progress"><i style="width:${count/3*100}%"></i></div></button>`}).join('')}<p class="small">Progress is saved on this device in your browser. Clearing browser data may reset it.</p>`}function render(){app.innerHTML=state.page==='home'?home():state.page==='subject'?subject():state.page==='lesson'?lesson():state.page==='lab'?lab():progressPage();let tabs=[['home','⌂','Discover'],['subject','📚','Learn'],['lab','🧪','Lab'],['progress','🏆','Progress']];document.getElementById('nav').innerHTML=tabs.map(([id,icon,label])=>`<button class="${state.page===id||(id==='subject'&&state.page==='lesson')?'active':''}" onclick="navigate('${id}')"><b>${icon}</b>${label}</button>`).join('');if(state.page==='lab')updateLab()}render();
</script></body></html>
